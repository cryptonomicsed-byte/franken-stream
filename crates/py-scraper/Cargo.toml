[package]
name = "franken-scraper"
version = "0.1.0"
edition = "2021"

[lib]
name = "_scraper"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py38"] }
pyo3-asyncio = { package = "pyo3-asyncio-0-21", version = "0.21.0", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
scraper = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
futures = "0.3"
percent-encoding = "2.3"

[build-dependencies]
pyo3-build-config = "0.22"
