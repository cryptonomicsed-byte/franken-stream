[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "franken-stream"
version = "0.1.0"
description = "Terminal media streamer for movies and TV shows"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Bino Elgua", email = "bino.elgua@example.com"}
]
keywords = ["cli", "streaming", "movies", "tv", "media"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "typer[all]>=0.9.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "yt-dlp>=2023.0.0",
    "rich>=13.0.0",
    "textual>=0.40.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[project.scripts]
franken-stream = "franken_stream.main:app"

[tool.setuptools]
packages = ["franken_stream"]

[tool.setuptools.package-data]
franken_stream = ["web_ui/*", "providers.json"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
